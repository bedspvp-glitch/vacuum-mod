name: Auto Version Bump

on:
  release:
    types: [published]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Strip leading 'v' if present (e.g. v1.0.0 → 1.0.0)
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG → Version: $VERSION"

      - name: Update gradle.properties
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/^mod_version=.*/mod_version=$VERSION/" gradle.properties
          echo "Updated mod_version to $VERSION"
          grep mod_version gradle.properties

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"
          git push origin HEAD:main
