name: Publish to Modrinth
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Kill existing Gradle daemons
        run: pkill -f GradleDaemon || true
      - name: Delete Loom lock files
        run: rm -f ~/.gradle/caches/fabric-loom/*.lock || true
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Vacuum ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release
          files: build/libs/vacuum-!(*-@(sources|javadoc)).jar
          game-versions: 1.21.4
          loaders: fabric
          dependencies: |
            fabric-api | depends | *
            modmenu | suggests | *
          changelog: ${{ github.event.release.body }}
