name: Release and Publish

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG => Version: $VERSION"

      - name: Patch mod_version in gradle.properties
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^mod_version=.*/mod_version=$VERSION/" gradle.properties
          grep mod_version gradle.properties

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon --no-parallel

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Vacuum ${{ github.event.release.tag_name }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          files: build/libs/vacuum-!(*-@(sources|javadoc)).jar
          game-versions: 1.21.4
          loaders: fabric
          dependencies: |
            fabric-api | depends | *
            modmenu | suggests | *
          changelog: ${{ github.event.release.body }}

      - name: Push version bump to main
        run: |
          GIT=$(which git)
          $GIT config user.name "github-actions[bot]"
          $GIT config user.email "github-actions[bot]@users.noreply.github.com"
          $GIT add gradle.properties
          $GIT diff --cached --quiet || $GIT -c commit.gpgsign=false commit --no-verify -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          $GIT push origin HEAD:main || true
