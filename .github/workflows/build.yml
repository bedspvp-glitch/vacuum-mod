name: Build Vacuum Mod
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Delete all Loom lock files
        run: find ~/.gradle -name "*.lock" -delete || true
      - name: Build mod
        run: ./gradlew build --no-daemon --no-parallel
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vacuum-mod-jar
          path: build/libs/vacuum-*.jar
          if-no-files-found: error
